name: SnapDoc
options:
  bundleIdPrefix: com.zacharybuhrts
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SDKROOT: iphoneos
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    # Left blank on purpose. Pick your Personal Team in Xcode.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  SnapDoc:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnapDoc
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharybuhrts.SnapDoc
        PRODUCT_NAME: SnapDoc
        INFOPLIST_FILE: SnapDoc/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_CFBundleDisplayName: SnapDoc
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    info:
      path: SnapDoc/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: SnapDoc uses the camera to photograph documents so they can be cropped, enhanced, and saved on this iPhone.
        UIFileSharingEnabled: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
  SnapDocTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnapDocTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharybuhrts.SnapDoc.tests
        PRODUCT_NAME: SnapDocTests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SnapDoc.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SnapDoc"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
    dependencies:
      - target: SnapDoc
schemes:
  SnapDoc:
    build:
      targets:
        SnapDoc: all
        SnapDocTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SnapDocTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
